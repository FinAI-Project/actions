name: Claude Code Review

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true
      model:
        type: string
        default: claude-sonnet-5
    secrets:
      ANTHROPIC_API_KEY:
        required: true

concurrency:
  group: claude-code-review-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          fetch-depth: 1

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Review only the changes in pull request
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            Focus only on actionable, high-confidence issues:
            - correctness and potential bugs
            - security vulnerabilities
            - meaningful performance regressions
            - violations of established repository conventions

            Do not comment on:
            - formatting or stylistic preferences
            - minor naming issues
            - hypothetical problems without a concrete failure scenario
            - unchanged code

            Use inline comments for specific issues.
            Keep the final summary concise.
            If no material issues are found, say so and do not create inline comments.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
