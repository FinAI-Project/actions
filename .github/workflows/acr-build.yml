name: Builds Docker image and push to ACR

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      build_context:
        required: false
        type: string
        default: .
      extra_context:
        required: false
        type: string
      deploy_namespace:
        type: string
      deploy_name:
        type: string
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_INSTALLATION_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_CONTAINER_REGISTRY:
        required: true

jobs:
  acr-build:
    runs-on:
      group: ArcCI
    steps:
      - name: GitHub login
        id: auth
        uses: TimoWilhelm/action-github-app-auth@v1.0.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          set-git-credentials: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.auth.outputs.access-token }}
          submodules: recursive

      # for pull base images
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set build variables
        id: build_vars
        working-directory: ${{ inputs.build_context }}
        run: |
          az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")"
          az acr login --name ${{ secrets.AZURE_CONTAINER_REGISTRY }}

          if [ -f .trivyignore.yaml ]; then
            echo "trivy_ignorefile=${{ inputs.build_context }}/.trivyignore.yaml" >> $GITHUB_OUTPUT
          elif [ -f .trivyignore ]; then
            echo "trivy_ignorefile=${{ inputs.build_context }}/.trivyignore" >> $GITHUB_OUTPUT
          else
            echo "trivy_ignorefile=" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ inputs.image_name }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_RECORD_RETENTION_DAYS: 3
        with:
          context: ${{ inputs.build_context }}
          build-contexts: ${{ inputs.extra_context }}
          load: true
          secrets: |
            GIT_AUTH_TOKEN=${{ steps.auth.outputs.access-token }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          timeout: 15m
          trivyignores: ${{ steps.build_vars.outputs.trivy_ignorefile }}
          # https://trivy.dev/docs/latest/guide/configuration/skipping/
          skip-files: /usr/local/lib/python*/site-packages/pip/_vendor/bom.cdx.json

      - name: Push Docker image
        run: |
          docker push ${{ steps.meta.outputs.tags }}

  deploy:
    needs: acr-build
    if: inputs.deploy_namespace != '' && inputs.deploy_name != ''
    runs-on:
      group: ArcCI
    steps:
      - name: Get short commit hash
        id: commit
        run: |
          sha_short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short=$sha_short" >> $GITHUB_OUTPUT

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Check deployment exists
        id: check
        run: |
          if kubectl get -n ${{ inputs.deploy_namespace }} deployment/${{ inputs.deploy_name }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Rollout restart deployment
        id: deploy
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "result=failure" >> $GITHUB_OUTPUT
          echo "Restarting deployment..."
          kubectl --field-manager=flux-client-side-apply \
            rollout restart -n ${{ inputs.deploy_namespace }} deployment/${{ inputs.deploy_name }}

          echo "Waiting for rollout to finish..."
          if kubectl rollout status -n ${{ inputs.deploy_namespace }} deployment/${{ inputs.deploy_name }} --timeout=60s; then
            echo "result=success" >> $GITHUB_OUTPUT
            exit 0
          fi

      # https://docs.slack.dev/tools/slack-github-action/sending-techniques/sending-data-slack-incoming-webhook/
      - name: Slack notification
        if: steps.check.outputs.exists == 'true'
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.DEPLOY_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ steps.deploy.outputs.result == 'success' && ':white_check_mark: *Deployment Successful*' || ':x: *Deployment Failed*' }}: *${{ inputs.deploy_namespace }}/${{ inputs.deploy_name }}*"
            attachments:
            - blocks:
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Status:*\n${{ steps.deploy.outputs.result == 'success' && ':rocket: Rolled out successfully' || ':warning: Rollout timed out or failed' }}"
                  - type: "mrkdwn"
                    text: "*Initiator:*\n${{ github.actor }}"
                accessory:
                  type: "button"
                  text:
                    type: "plain_text"
                    text: "View Logs"
                  url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "Branch: `${{ github.ref_name }}` | Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.commit.outputs.short }}>"

      - name: Fail job if deploy failed
        if: steps.deploy.outputs.result == 'failure'
        run: exit 1