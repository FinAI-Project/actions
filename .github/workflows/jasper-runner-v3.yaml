name: Run Kubernetes Job

on:
  workflow_call:
    inputs:
      batch:
        type: string
      datapath:
        type: string
        required: true
        default: /data/JP_end_2025-07-22/data_2
      seeds:
        type: string
      runlevel:
        type: string
        required: true
      region:
        type: string
        required: true
      gpupool:
        type: string
        required: true
      skip_sanity:
        type: boolean
        default: true
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_INSTALLATION_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

jobs:
  submit-job:
    runs-on:
      group: ArcCD
      labels: ${{ inputs.region }}
    steps:
      - name: GitHub login
        id: auth
        uses: TimoWilhelm/action-github-app-auth@v1.0.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          set-git-credentials: true
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.auth.outputs.access-token }}
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Deploy Kubernetes Job
        env:
          VIRTUAL_ENV: ${{ runner.temp }}/.venv
          INPUT_BATCH: ${{ inputs.batch }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_GPUPOOL: ${{ inputs.gpupool }}
          AWS_ECR_REGISTRY: 179138733276.dkr.ecr.us-west-2.amazonaws.com
          SKIP_SANITY: ${{ inputs.skip_sanity }}
        run: |
          echo "::group::Experiment Parameters"
          echo "batch: ${{ inputs.batch }}"
          echo "datapath: ${{ inputs.datapath }}"
          echo "seeds: ${{ inputs.seeds }}"
          echo "runlevel: ${{ inputs.runlevel }}"
          echo "region: ${{ inputs.region }}"
          echo "gpupool: ${{ inputs.gpupool }}"
          echo "::endgroup::"

          python -m venv $VIRTUAL_ENV
          source $VIRTUAL_ENV/bin/activate
          pip install git+https://x-access-token:${{ steps.auth.outputs.access-token }}@github.com/FinAI-Project/compass-mlops.git@main
          python app/single_job.py --run-level ${{ inputs.runlevel }} --data ${{ inputs.datapath }} --seeds "${{ inputs.seeds }}" --job-scheduler kubernetes
