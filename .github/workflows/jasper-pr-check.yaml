name: PR Merge Check

on:
  workflow_call:
    inputs:
      data_path:
        type: string
        default: /data/HK_end_2026-03-31/data
      config_name:
        type: string
        default: sanity
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_INSTALLATION_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

env:
  CACHE_DIR: /home/runner/_cache

jobs:
  merge-check:
    runs-on:
      group: Arc
    steps:
      - name: GitHub login
        id: auth
        uses: TimoWilhelm/action-github-app-auth@v1.0.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          installation-id: ${{ secrets.GH_APP_INSTALLATION_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          set-git-credentials: true
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.auth.outputs.access-token }}
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download requirements
        run: |
          curl -fSLo requirements.txt \
            -H "Accept: application/vnd.github.v3.raw" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access-token }}" \
            "https://api.github.com/repos/FinAI-Project/containers/contents/compass-runtime/requirements-v4.txt?ref=main"
      - name: Create virtual environment
        env:
          VIRTUAL_ENV: ${{ env.CACHE_DIR }}/${{ hashFiles('requirements.txt') }}/.venv
        run: |
          mkdir -p $VIRTUAL_ENV
          if [ ! -e "$(readlink -f $VIRTUAL_ENV/bin/python)" ]; then
            rm -rf $VIRTUAL_ENV
          fi
          python -m venv $VIRTUAL_ENV
          source $VIRTUAL_ENV/bin/activate
          pip install -r requirements.txt
      - name: Run sanity test
        env:
          VIRTUAL_ENV: ${{ env.CACHE_DIR }}/${{ hashFiles('requirements.txt') }}/.venv
          CUBLAS_WORKSPACE_CONFIG: :4096:8
          # v4.x environment variables
          FENGHE_BUILD_DIR: ${{ env.CACHE_DIR }}/builds
          TORCH_CUDA_ARCH_LIST: "7.5"
          CMAKE_CUDA_ARCHITECTURES: "75"
          HYDRA_FULL_ERROR: "1"
          DATA_SOURCE_PATH: ${{ inputs.data_path }}
          CONFIG_NAME: ${{ inputs.config_name }}
        run: |
          source $VIRTUAL_ENV/bin/activate
          cd ${{ runner.temp }}
          make -f $GITHUB_WORKSPACE/app2/Makefile
